services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./runtime/uploads:/app/runtime/uploads
      - ./runtime/renders:/app/runtime/renders
      - ./runtime/temp:/app/runtime/temp
      - ./runtime/db:/app/runtime/db
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEV_MODE=false
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --soft-time-limit=540 --time-limit=600 --concurrency=4 --max-tasks-per-child=10
    volumes:
      - ./runtime/uploads:/app/runtime/uploads
      - ./runtime/renders:/app/runtime/renders
      - ./runtime/temp:/app/runtime/temp
      - ./runtime/db:/app/runtime/db
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEV_MODE=false
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping", "-d", "celery@$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '3.0'
        reservations:
          memory: 512M
          cpus: '0.5'

volumes:
  redis_data:
