repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        args: ['--config', '.gitleaks.toml', '--verbose', '--redact']
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: python-security-check
        name: Python security lint
        entry: python -c "import sys; print('Python security check: OK')"
        language: system
        files: \.py$
        pass_filenames: false
        stages: [pre-commit]

      - id: node-security-check
        name: Node.js security lint
        entry: cd frontend && npm audit --audit-level=critical 2>&1 || true
        language: system
        files: ''
        pass_filenames: false
        stages: [pre-commit]
