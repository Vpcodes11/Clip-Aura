user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    
    # Hide nginx version
    server_tokens off;

    # Rate limiting zone for API (10MB of state, 30 requests per second)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name clipaura.example.com; # PLACEHOLDER
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name clipaura.example.com; # PLACEHOLDER

        # TLS termination (paths to be replaced with real certs)
        ssl_certificate /etc/ssl/certs/clipaura.crt;
        ssl_certificate_key /etc/ssl/private/clipaura.key;

        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Allow huge video uploads
        client_max_body_size 2G;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers (complementing app-level headers)
        # Note: FastAPI/Next.js already set these, but we can enforce them here if needed.
        # We don't want to duplicate them, but these are good defaults if the app misses them.
        # add_header X-Content-Type-Options nosniff;
        # add_header X-Frame-Options DENY;
        # add_header Referrer-Policy strict-origin-when-cross-origin;

        # API Endpoints
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend:8000/api/;
            
            # Timeouts for large video processing tasks
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # WebSockets
        location /ws/ {
            proxy_pass http://backend:8000/ws/;
            
            # WebSocket specific headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Long timeout for connections
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Default proxy to backend
        location / {
            proxy_pass http://backend:8000/;
        }
    }
}
